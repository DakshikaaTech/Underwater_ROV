<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ROV Control Simulation</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; color: #38bdf8; }
        .alert-safe { background: #166534; padding: 10px; border-radius: 6px; font-weight: bold; }
        .alert-danger { background: #991b1b; padding: 10px; border-radius: 6px; font-weight: bold; }
        button { padding: 12px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 6px; margin: 5px; }
        .btn-arm { background: #22c55e; color: white; }
        .btn-disarm { background: #ef4444; color: white; }
        .control-group { margin: 15px 0; }
        input[type=range] { width: 100%; cursor: pointer; }
        .telemetry-val { font-family: monospace; color: #34d399; font-size: 1.2em; }
    </style>
</head>
<body>

    <h1>Underwater ROV Simulation Dashboard</h1>
    
    <div class="card" style="margin-bottom: 20px;">
        <div id="leakAlert" class="alert-safe">System Status: Dry & Secure</div>
        <div style="margin-top: 15px;">
            <button class="btn-arm" onclick="setArmState(true)">ARM ROV</button>
            <button class="btn-disarm" onclick="setArmState(false)">DISARM ROV</button>
            <p>Arm Status: <span id="armStatusLabel" style="font-weight:bold; color:#ef4444;">DISARMED</span></p>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Propulsion (Thrusters)</h2>
            <div class="control-group"><label>Surge: <span id="surgeVal">0.0</span></label><input type="range" id="surge" min="-1" max="1" step="0.05" value="0" oninput="sendThrusters()"></div>
            <div class="control-group"><label>Heave: <span id="heaveVal">0.0</span></label><input type="range" id="heave" min="-1" max="1" step="0.05" value="0" oninput="sendThrusters()"></div>
            <div class="control-group"><label>Yaw: <span id="yawVal">0.0</span></label><input type="range" id="yaw" min="-1" max="1" step="0.05" value="0" oninput="sendThrusters()"></div>
        </div>

        <div class="card">
            <h2>Robotic Arm (70KG Servos)</h2>
            <div class="control-group"><label>Servo 1: <span id="s0Val">135</span>°</label><input type="range" id="servo0" min="0" max="270" step="1" value="135" oninput="sendServo(0)"></div>
            <div class="control-group"><label>Servo 2: <span id="s1Val">135</span>°</label><input type="range" id="servo1" min="0" max="270" step="1" value="135" oninput="sendServo(1)"></div>
        </div>

        <div class="card">
            <h2>Sensor Telemetry</h2>
            <p>Depth: <span class="telemetry-val" id="depth">0.00</span> m</p>
            <p>Pitch: <span class="telemetry-val" id="pitch">0.0</span>°</p>
            <p>Roll: <span class="telemetry-val" id="roll">0.0</span>°</p>
            <p>Heading: <span class="telemetry-val" id="heading">0.0</span>°</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.min.js"></script>
    <script>
        const socket = io();
        setInterval(() => { socket.emit('heartbeat'); }, 500);

        function setArmState(state) { socket.emit('set_arm_state', { armed: state }); }
        function sendThrusters() {
            let surge = parseFloat(document.getElementById('surge').value);
            let heave = parseFloat(document.getElementById('heave').value);
            let yaw = parseFloat(document.getElementById('yaw').value);
            document.getElementById('surgeVal').innerText = surge;
            document.getElementById('heaveVal').innerText = heave;
            document.getElementById('yawVal').innerText = yaw;
            socket.emit('thruster_vector', { surge: surge, heave: heave, yaw: yaw });
        }
        function sendServo(servoId) {
            let angle = parseInt(document.getElementById('servo' + servoId).value);
            document.getElementById('s' + servoId + 'Val').innerText = angle;
            socket.emit('servo_command', { id: servoId, angle: angle });
        }

        socket.on('telemetry_data', function(data) {
            let armLbl = document.getElementById('armStatusLabel');
            armLbl.innerText = data.armed ? "ARMED" : "DISARMED";
            armLbl.style.color = data.armed ? "#22c55e" : "#ef4444";

            let leakDiv = document.getElementById('leakAlert');
            leakDiv.className = data.leak ? "alert-danger" : "alert-safe";
            leakDiv.innerText = data.leak ? "CRITICAL WARNING: WATER LEAK DETECTED!" : "System Status: Dry & Secure";

            document.getElementById('depth').innerText = data.depth.toFixed(2);
            document.getElementById('pitch').innerText = data.pitch.toFixed(1);
            document.getElementById('roll').innerText = data.roll.toFixed(1);
            document.getElementById('heading').innerText = data.heading.toFixed(1);
        });
    </script>
</body>
</html>
